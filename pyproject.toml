[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedia"
version = "2.0.0"
description = "LiA - Linked Intelligent Analyst: eventi, mercati e precedenti storici"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
deploy = ["gunicorn>=22"]

[project.scripts]
linkedia = "linkedia.cli:main"

[tool.setuptools.packages.find]
include = ["linkedia*"]

[tool.setuptools.package-data]
linkedia = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: chiama servizi esterni reali (escluso di default)"]
addopts = "-m 'not external'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
